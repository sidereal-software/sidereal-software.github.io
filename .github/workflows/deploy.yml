name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Changing the Pages source or custom domain needs repo-admin rights the
      # workflow token does not have, so misconfiguration can only be detected,
      # not repaired, from here. Legacy branch builds deploy the unbuilt repo
      # root and drop the custom domain (CNAME no longer sits at the repo root).
      - name: Verify Pages configuration
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed to $url"
          if [ "${url%/}" != "https://sidereal.software" ]; then
            echo "::error::Pages is misconfigured (deployed to $url). In Settings > Pages set Source to 'GitHub Actions' and Custom domain to 'sidereal.software'."
            exit 1
          fi
