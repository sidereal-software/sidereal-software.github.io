name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site must use workflow builds (not legacy branch builds, which
      # would deploy the unbuilt repo root) and must keep the custom domain,
      # which legacy builds drop because CNAME no longer sits at the repo root.
      - name: Configure Pages source and custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/pages-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow","cname":"sidereal.software"}')
          echo "Pages API responded $status"
          cat /tmp/pages-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to configure Pages. Set Source to 'GitHub Actions' and Custom domain to 'sidereal.software' manually in Settings > Pages."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
