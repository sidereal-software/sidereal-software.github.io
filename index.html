<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applied before first paint to avoid a theme flash.
      ;(function () {
        var stored = localStorage.getItem('theme')
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <title>Sidereal Software | Engineering the night sky</title>
    <meta
      name="description"
      content="Production software for observatories, missions, and research teams in astronomy and beyond. From telescope control to real-time data platforms." />

      property="og:description"
      content="Production software for observatories, missions, and research teams in astronomy and beyond." />
